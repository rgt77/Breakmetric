name: Mobile contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "src/mobile.js"
      - "scripts/validate-mobile.mjs"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate mobile contracts
        run: |
          node --check src/mobile.js
          node --check scripts/validate-mobile.mjs
          node scripts/validate-mobile.mjs
