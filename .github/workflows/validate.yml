name: BreakMetric validation

on:
  push:
    branches: ["main", "v1.*", "step-*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate data contracts and UI invariants
        run: node scripts/validate.mjs
      - name: Smoke-test analysis models
        run: node scripts/smoke-models.mjs
      - name: Syntax-check source modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done
