name: BreakMetric validation

on:
  push:
    branches: ["main", "v1.*", "step-*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Audit source-module inventory
        run: node scripts/audit-source-modules.mjs
      - name: Check EV eligible inventory outputs
        run: node scripts/generate-ev-eligible-inventory.mjs --check
      - name: Validate EV eligible inventory
        run: node scripts/validate-ev-eligible-inventory.mjs
      - name: Check generated pipeline outputs
        run: node scripts/generate-v13-pipeline.mjs --check
      - name: Check runtime data fingerprint
        run: node scripts/generate-data-version.mjs --check
      - name: Validate market records
        run: node scripts/validate-market-records.mjs
      - name: Validate market verification contract
        run: node scripts/validate-market-verification-contract.mjs
      - name: Validate market verification tasks
        run: node scripts/validate-market-verification-tasks.mjs
      - name: Test market verification evidence ingest
        run: node scripts/test-market-verification-evidence.mjs
      - name: Test market verification evidence template
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-market-verification-template.mjs
          node --check scripts/create-market-verification-evidence-template.mjs
      - name: Test market verification candidate recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-market-verification-candidate.mjs
          node --check scripts/assess-market-verification-candidate.mjs
      - name: Validate EV derivation provenance
        run: node scripts/validate-ev-provenance.mjs
      - name: Validate player derivation reproducibility
        run: node scripts/validate-player-derivation.mjs
      - name: Test spot and FX state
        run: node scripts/test-spot-fx.mjs
      - name: Test runtime races and dependency guard
        run: node scripts/test-runtime-races.mjs
      - name: Test product selection race
        run: node scripts/test-selection-race.mjs
      - name: Test market record context race
        run: node scripts/test-market-record-race.mjs
      - name: Test versioned data cache
        run: node scripts/test-data-cache-version.mjs
      - name: Validate data contracts and UI invariants
        run: node scripts/validate.mjs
      - name: Smoke-test analysis models
        run: node scripts/smoke-models.mjs
      - name: Syntax-check source modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done
