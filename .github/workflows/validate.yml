name: BreakMetric validation

on:
  push:
    branches: ["main", "v1.*", "step-*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate development ledger
        run: node scripts/validate-development-ledger.mjs
      - name: Audit source-module inventory
        run: node scripts/audit-source-modules.mjs
      - name: Check EV eligible inventory outputs
        run: node scripts/generate-ev-eligible-inventory.mjs --check
      - name: Validate EV eligible inventory
        run: node scripts/validate-ev-eligible-inventory.mjs
      - name: Check Chelsea market anchors
        run: node scripts/generate-chelsea-market-anchor.mjs --check
      - name: Check Chelsea EV completion queue
        run: node scripts/generate-chelsea-ev-completion-queue.mjs --check
      - name: Validate Chelsea EV completion queue
        run: node scripts/validate-chelsea-ev-completion-queue.mjs
      - name: Validate Phase-2 EV valuation research
        run: node scripts/validate-ev-valuation-research.mjs
      - name: Check generated pipeline outputs
        run: node scripts/generate-v13-pipeline.mjs --check
      - name: Reproduce browser Hobby runtime contract
        run: node scripts/diagnose-runtime-contract.mjs
      - name: Validate market automation contract
        run: |
          node scripts/validate-market-automation-config.mjs
          node scripts/validate-collector-ops.mjs
      - name: Test continuous market collector
        run: |
          node scripts/test-continuous-market-collector.mjs
          node scripts/test-collector-autonomy.mjs
          node scripts/test-collector-end-to-end.mjs
      - name: Check collector health model
        run: node scripts/check-collector-health.mjs
      - name: Smoke-generate full-release valuation candidates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-automated-valuation-candidates.mjs --output /tmp/automated-valuation-candidates.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/automated-valuation-candidates.json","utf8")); if(x.summary.eligible_slot_count!==8896) process.exit(1);'
      - name: Test valuation tier separation
        run: node scripts/test-automated-valuation-tier-separation.mjs
      - name: Backtest modeled valuation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-valuation-model.mjs
          node scripts/generate-valuation-backtest.mjs --output /tmp/valuation-backtest.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/valuation-backtest.json","utf8")); if(x.population.canonical_holdout_count!==33) process.exit(1); if(x.summary.holdout_count!==33) process.exit(1); if(x.summary.predicted_count+x.summary.unknown_count!==33) process.exit(1);'
      - name: Test valuation confidence gates
        run: node scripts/test-valuation-confidence-gates.mjs
      - name: Syntax-check market automation scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/collect-market-data.mjs
          node --check scripts/import-sportscardspro-csv.mjs
          node --check scripts/generate-automated-valuation-candidates.mjs
          node --check scripts/test-automated-valuation-tier-separation.mjs
          node --check scripts/generate-valuation-backtest.mjs
          node --check scripts/test-valuation-model.mjs
          node --check scripts/test-valuation-confidence-gates.mjs
          node --check scripts/lib/valuation-model.mjs
          node --check scripts/check-collector-health.mjs
          node --check scripts/validate-collector-ops.mjs
          node --check scripts/test-collector-autonomy.mjs
          node --check scripts/test-collector-end-to-end.mjs
          node --check scripts/lib/market-automation.mjs
          node --check scripts/lib/ev-slot-inventory.mjs
          node --check scripts/lib/collector-telemetry.mjs
      - name: Check runtime data fingerprint
        run: node scripts/generate-data-version.mjs --check
      - name: Validate market records
        run: node scripts/validate-market-records.mjs
      - name: Validate market verification contract
        run: node scripts/validate-market-verification-contract.mjs
      - name: Validate market verification tasks
        run: node scripts/validate-market-verification-tasks.mjs
      - name: Test market verification evidence ingest
        run: node scripts/test-market-verification-evidence.mjs
      - name: Test market verification evidence template
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-market-verification-template.mjs
          node --check scripts/create-market-verification-evidence-template.mjs
      - name: Test market verification candidate recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-market-verification-candidate.mjs
          node --check scripts/assess-market-verification-candidate.mjs
      - name: Validate persisted market candidates
        run: node scripts/validate-market-verification-candidates.mjs
      - name: Test unresolved market research queue
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-market-verification-research.mjs
          node scripts/next-market-verification-research-task.mjs
          node --check scripts/next-market-verification-research-task.mjs
      - name: Validate EV derivation provenance
        run: node scripts/validate-ev-provenance.mjs
      - name: Validate player derivation reproducibility
        run: node scripts/validate-player-derivation.mjs
      - name: Test spot and FX state
        run: node scripts/test-spot-fx.mjs
      - name: Test runtime races and dependency guard
        run: node scripts/test-runtime-races.mjs
      - name: Test product selection race
        run: node scripts/test-selection-race.mjs
      - name: Test simplified selection flow
        run: node scripts/test-selection-flow.mjs
      - name: Test market record context race
        run: node scripts/test-market-record-race.mjs
      - name: Test versioned data cache
        run: node scripts/test-data-cache-version.mjs
      - name: Validate data contracts and UI invariants
        run: node scripts/validate.mjs
      - name: Smoke-test analysis models
        run: node scripts/smoke-models.mjs
      - name: Syntax-check source modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done
