name: BreakMetric validation

on:
  push:
    branches: ["main", "v1.1-hardening-n20"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate data contracts and UI hardening
        run: node scripts/validate.mjs
      - name: Syntax-check source modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done
