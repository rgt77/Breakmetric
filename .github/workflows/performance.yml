name: Performance contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "data/validation/performance-budget-v1.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate performance contracts
        run: |
          node scripts/validate-performance.mjs
          node scripts/validate-performance-budget.mjs
